name: workflow.yml
on:
  push:
    branches:
      - main
      - feature-test

jobs:
  build-image-api:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Connexion à GHCR
        uses: docker/login-action@v2
        with:
          registry: https://ghcr.io
          username: NWB-H
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/nwb-h/windigo-serigraphie-projet-api:latest
            ghcr.io/nwb-h/windigo-serigraphie-projet-api:${{ github.sha }}

  build-image-spa:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Connexion à GHCR
        uses: docker/login-action@v2
        with:
          registry: https://ghcr.io
          username: NWB-H
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: spa
          push: true
          tags: |
            ghcr.io/nwb-h/windigo-serigraphie-projet-spa:latest
            ghcr.io/nwb-h/windigo-serigraphie-projet-spa:${{ github.sha }}

  build-api:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Composer Dependencies
        working-directory: api
        run: composer install
      - name: Zip project
        run: tar -czf api.tar.gz -C api .
      - name: Upload API as artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: api.tar.gz
          
  build-spa:
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js Dependencies
        working-directory: spa
        run: npm install -D sass-embedded && npm run build
      - name: Zip project
        run: tar -czf spa.tar.gz -C spa/dist .
      - name: Upload SPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: spa
          path: spa.tar.gz
          
  deploy:
    needs: [build-api, build-spa]
    runs-on: ubuntu-latest
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api
          path: ./deploy

      - name: Download SPA artifact
        uses: actions/download-artifact@v4
        with:
          name: spa
          path: ./deploy

      - name: Deploy to o2switch via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          local-dir: ./deploy/
          server-dir: /www/
          
