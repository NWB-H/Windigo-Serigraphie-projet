name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist
          yarn

      - name: Run Pint
        run: vendor/bin/pint

      - name: Format Frontend
        run: yarn format

      - name: Lint Frontend
        run: yarn lint
